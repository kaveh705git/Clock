<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساعت و تقویم</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #2b2b3d 0%, #0f0f17 70%);
    font-family: 'Vazirmatn', 'Tahoma', sans-serif;
    font-weight: 400;
    color: #fff;
    padding: 20px;
  }

  /* لینک بالای ساعت */
  .top-link {
    margin-bottom: 35px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #5bbc05;
    text-decoration: none;
    padding: 12px 32px;
    border-radius: 50px;
    background: linear-gradient(145deg, rgba(201,162,39,0.15), rgba(201,162,39,0.05));
    border: 1.5px solid rgba(201,162,39,0.5);
    text-shadow: 0 0 12px rgba(201,162,39,0.6);
    box-shadow: 0 0 25px rgba(201,162,39,0.2), inset 0 0 15px rgba(201,162,39,0.1);
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .top-link:hover {
    color: #fff;
    border-color: #c9a227;
    background: linear-gradient(145deg, rgba(201,162,39,0.35), rgba(201,162,39,0.15));
    box-shadow: 0 0 40px rgba(201,162,39,0.5), inset 0 0 20px rgba(201,162,39,0.2);
    transform: translateY(-2px);
  }

  .top-link .icon { font-size: 24px; }

 .onwan {
    margin-bottom: 35px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 22px;

  /* ظرف ساعت */
  .clock-container {
    position: relative;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1e1e2a, #101018);
    box-shadow:
      0 0 0 8px #1a1a24,
      0 0 0 12px #c9a227,
      0 20px 50px rgba(0,0,0,0.7),
      inset 0 0 30px rgba(0,0,0,0.8);
  }

  .clock-face {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
  }

  /* لایه عکس پس‌زمینه داخل ساعت */
  .clock-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.3;   /* ← شفافیت عکس را اینجا تنظیم کن (۰ تا ۱) */
    z-index: 0;
    transition: opacity 0.3s ease;
  }

  .number {
    position: absolute;
    left: 50%;
    top: 50%;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #e8e8e8;
    text-shadow: 0 0 6px rgba(201,162,39,0.5);
    z-index: 2;
  }

  .hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: bottom center;
    border-radius: 10px;
    transform: translateX(-50%) rotate(0deg);
  }

  .hand.hour {
    width: 8px; height: 75px;
    background: linear-gradient(to top, #c9a227, #f5e28a);
    box-shadow: 0 0 10px rgba(201,162,39,0.8);
    z-index: 3;
  }

  .hand.minute {
    width: 6px; height: 105px;
    background: linear-gradient(to top, #dcdcdc, #ffffff);
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
    z-index: 4;
  }

  .hand.second {
    width: 2px; height: 120px;
    background: #e63946;
    box-shadow: 0 0 10px rgba(230,57,70,0.9);
    z-index: 5;
  }

  .center-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 18px; height: 18px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, #f5e28a, #c9a227);
    border-radius: 50%;
    z-index: 6;
    box-shadow: 0 0 15px rgba(201,162,39,0.9);
  }

  .center-dot::after {
    content: '';
    position: absolute;
    inset: 5px;
    background: #101018;
    border-radius: 50%;
  }

  .date-display {
    margin-top: 40px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 24px;
    font-weight: 600;
    color: #f0e6d2;
    text-shadow: 0 0 20px rgba(201,162,39,0.4);
    padding: 12px 28px;
    border-radius: 50px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,162,39,0.25);
  }

  .tick {
    position: absolute;
    left: 50%; top: 50%;
    background: #8a8a9a;
    border-radius: 2px;
    z-index: 2;
  }

  /* دکمه صدا */
  .sound-btn {
    margin-top: 25px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #f5e28a;
    cursor: pointer;
    padding: 10px 24px;
    border-radius: 50px;
    background: rgba(201,162,39,0.08);
    border: 1.5px solid rgba(201,162,39,0.4);
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }

  .sound-btn:hover {
    color: #fff;
    border-color: #c9a227;
    background: rgba(201,162,39,0.25);
    box-shadow: 0 0 20px rgba(201,162,39,0.4);
  }

  .sound-btn.playing {
    color: #0f0f17;
    background: linear-gradient(145deg, #f5e28a, #c9a227);
    border-color: #f5e28a;
    box-shadow: 0 0 25px rgba(201,162,39,0.7);
  }
</style>
</head>
<body>


  
  <!-- لینک بالای ساعت -->
 <a class="onwan">ساعت و تقویم</a>
 <br>
  <a class="top-link" href="https://t.me/vpnv2rayshadowrocket" target="_blank" rel="noopener">
    <span class="icon"></span>
    اهدایی فیلترشکن کاوه❤️
  </a>
>

  <!-- ساعت -->
  <div class="clock-container">
    <div class="clock-face" id="clockFace">
      <div class="clock-bg" id="clockBg"></div>
      <div class="center-dot"></div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
    </div>
  </div>

  <!-- تاریخ شمسی -->
  <div class="date-display" id="dateDisplay">در حال بارگذاری...</div>

  <!-- دکمه صدا -->
  <button class="sound-btn" id="soundBtn">
    <span class="icon" id="soundIcon">🔇</span>
    <span id="soundText">پخش صدا</span>
  </button>

  <!-- فایل صوتی پس‌زمینه -->
  <audio id="bgAudio" loop preload="auto">
    <source src="ambient.mp3" type="audio/mpeg">
  </audio>

<script>
(function() {
  'use strict';

  /* ============== ساخت ساعت ============== */
  var clockFace = document.getElementById('clockFace');
  var radius = 120;

  // تیک‌های دقیقه
  for (var i = 0; i < 60; i++) {
    var tick = document.createElement('div');
    tick.className = 'tick';
    var isHour = (i % 5 === 0);
    var angle = (i * 6) * Math.PI / 180;
    var x = Math.sin(angle) * radius;
    var y = -Math.cos(angle) * radius;
    tick.style.width = isHour ? '4px' : '2px';
    tick.style.height = isHour ? '13px' : '7px';
    tick.style.transform = 'translate(-50%,-50%) translate(' + x + 'px,' + y + 'px) rotate(' + (i * 6) + 'deg)';
    tick.style.background = isHour ? '#c9a227' : '#5a5a6a';
    clockFace.appendChild(tick);
  }

  // اعداد ۱ تا ۱۲
  var persianNumbers = ['۱۲','۱','۲','۳','۴','۵','۶','۷','۸','۹','۱۰','۱۱'];
  for (var j = 0; j < 12; j++) {
    var num = document.createElement('div');
    num.className = 'number';
    num.textContent = persianNumbers[j];
    var a = (j * 30) * Math.PI / 180;
    var nx = Math.sin(a) * (radius - 30);
    var ny = -Math.cos(a) * (radius - 30);
    num.style.transform = 'translate(-50%,-50%) translate(' + nx + 'px,' + ny + 'px)';
    clockFace.appendChild(num);
  }

  var hourHand = document.getElementById('hourHand');
  var minuteHand = document.getElementById('minuteHand');
  var secondHand = document.getElementById('secondHand');
  var dateDisplay = document.getElementById('dateDisplay');

  /* ============== به‌روزرسانی ساعت ============== */
  function updateClock() {
    var now = new Date();
    var sec = now.getSeconds();
    var min = now.getMinutes();
    var hr = now.getHours();
    secondHand.style.transform = 'translateX(-50%) rotate(' + (sec * 6) + 'deg)';
    minuteHand.style.transform = 'translateX(-50%) rotate(' + (min * 6 + sec * 0.1) + 'deg)';
    hourHand.style.transform = 'translateX(-50%) rotate(' + ((hr % 12) * 30 + min * 0.5) + 'deg)';
  }

  /* ============== تاریخ شمسی ============== */
  function toPersianDate(date) {
    var gy = date.getFullYear();
    var gm = date.getMonth() + 1;
    var gd = date.getDate();
    var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
    var jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    var gy2 = (gm > 2) ? (gy + 1) : gy;
    var days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) {
      jy += Math.floor((days - 1) / 365);
      days = (days - 1) % 365;
    }
    var jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    return { jy: jy, jm: jm, jd: jd };
  }

  var persianWeekdays = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  var persianMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

  function toPersianDigits(str) {
    return String(str).replace(/\d/g, function(d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; });
  }

  function updateDate() {
    try {
      var now = new Date();
      var p = toPersianDate(now);
      dateDisplay.textContent = persianWeekdays[now.getDay()] + ' ' + toPersianDigits(p.jd) + ' ' + persianMonths[p.jm - 1];
    } catch(e) {
      dateDisplay.textContent = 'خطا در تاریخ';
    }
  }

  /* ============== صدا پس‌زمینه ============== */
  var audio = document.getElementById('bgAudio');
  var soundBtn = document.getElementById('soundBtn');
  var soundIcon = document.getElementById('soundIcon');
  var soundText = document.getElementById('soundText');

  audio.volume = 0.4;

  soundBtn.addEventListener('click', function() {
    if (audio.paused) {
      audio.play().then(function() {
        soundIcon.textContent = '🔊';
        soundText.textContent = 'قطع صدا';
        soundBtn.classList.add('playing');
      }).catch(function(err) {
        console.log('خطا در پخش صدا:', err);
        alert('فایل صوتی پیدا نشد. لطفاً ambient.mp3 را کنار index.html قرار دهید.');
      });
    } else {
      audio.pause();
      soundIcon.textContent = '🔇';
      soundText.textContent = 'پخش صدا';
      soundBtn.classList.remove('playing');
    }
  });

  /* ============== شروع ============== */
  updateClock();
  updateDate();
  setInterval(updateClock, 1000);
  setInterval(updateDate, 60000);
})();
</script>

</body>
</html>
